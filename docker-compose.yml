services:
  postgres:
    image: postgres:17
    container_name: studyassist-postgres
    environment:
      POSTGRES_USER: studyassist
      POSTGRES_PASSWORD: studyassist_dev
      POSTGRES_DB: studyassist
    ports:
      - "5432:5432"
    volumes:
      - studyassist-pgdata:/var/lib/postgresql/data
    networks:
      - studyassist-net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    container_name: studyassist-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - studyassist-qdrant:/qdrant/storage
    networks:
      - studyassist-net
    restart: unless-stopped

  pix2text:
    build:
      context: .
      dockerfile: Dockerfile.pix2text
    container_name: studyassist-pix2text
    ports:
      - "8503:8503"
    volumes:
      - studyassist-pix2text-models:/root/.pix2text
    networks:
      - studyassist-net
    restart: unless-stopped

networks:
  studyassist-net:
    driver: bridge

volumes:
  studyassist-pgdata:
  studyassist-qdrant:
  studyassist-pix2text-models:
