services:
  postgres:
    image: postgres:17
    container_name: studyassist-postgres
    environment:
      POSTGRES_USER: studyassist
      POSTGRES_PASSWORD: studyassist_dev
      POSTGRES_DB: studyassist
    ports:
      - "5432:5432"
    volumes:
      - studyassist-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  studyassist-pgdata:
